dataSources:
  Lightspot_user_master:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3307/Lightspot_live_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    idle-timeout: 300000
    minimum-idle: 5
    pool-name: Lightspot-db-user-master
    maximum-pool-size: 30
    connection-timeout: 30000
    connection-init-sql: SELECT 1
    connection-test-query: SELECT 1
  Lightspot_user_slave0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3308/Lightspot_live_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    idle-timeout: 300000
    minimum-idle: 5
    pool-name: Lightspot-db-user-slave0
    maximum-pool-size: 30
    connection-timeout: 30000
    connection-init-sql: SELECT 1
    connection-test-query: SELECT 1

rules:
  - !READWRITE_SPLITTING
    dataSources:
      Lightspot_user_ds:
        staticStrategy:
          writeDataSourceName: Lightspot_user_master
          readDataSourceNames:
            - Lightspot_user_slave0
        loadBalancerName: Lightspot_round_robin
    loadBalancers:
      Lightspot_round_robin:
        type: ROUND_ROBIN
  - !SINGLE
    defaultDataSource: Lightspot_user_ds
  - !SHARDING
    tables:
      t_user:
        actualDataNodes: Lightspot_user_ds.t_user_${(0..99).collect(){it.toString().padLeft(2,'0')}}
        tableStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: t_user-inline

    shardingAlgorithms:
      t_user-inline:
        type: INLINE
        props:
          algorithm-expression: t_user_${(user_id % 100).toString().padLeft(2,'0')}

props:
  sql-show: true
